services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

  api:
    build: .
    environment:
      SUPABASE_URL: https://your-project.supabase.co
      SUPABASE_KEY: your-anon-or-service-role-key
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/
      INTERNAL_API_KEY: change-me
    ports:
      - "8000:8000"
    depends_on:
      - rabbitmq

  worker:
    build: .
    command: ["python", "-m", "app.mq.consumers.ingestion_worker"]
    environment:
      SUPABASE_URL: https://your-project.supabase.co
      SUPABASE_KEY: your-anon-or-service-role-key
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/
      INTERNAL_API_KEY: change-me
    depends_on:
      - rabbitmq
