spring.application.name=interviewrepo-test

# Use in-memory H2 database for hermetic tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Test JWKS endpoint configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://test.supabase.co/auth/v1
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://test.supabase.co/auth/v1/.well-known/jwks.json

app.cors.allowed-origins=http://localhost:5173,http://localhost:3000
