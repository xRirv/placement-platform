spring.application.name=interviewrepo

server.port=8080

# Supabase Auth / JWT Resource Server Configuration
# Note: For asymmetric JWTs (RS256/ES256), Spring Security uses JWKS URI to dynamically fetch public keys.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SUPABASE_ISSUER_URI:https://your-project.supabase.co/auth/v1}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SUPABASE_JWK_SET_URI:https://your-project.supabase.co/auth/v1/.well-known/jwks.json}

# PostgreSQL / Supabase Database Connection
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/interviewrepo}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# CORS configuration
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173,http://localhost:3000}
